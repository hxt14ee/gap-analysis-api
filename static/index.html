<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gap Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app">

        <header class="top-bar">
            <span class="logo">🔍 Gap Analysis</span>
            <p class="subtitle">Сравни страницу с тем, что Google показывает в AI&nbsp;Overview</p>
        </header>

        <!-- Вкладки -->
        <nav class="tabs">
            <button class="tab active" data-tab="analyze" onclick="switchTab('analyze', this)">▶ Новый анализ</button>
            <button class="tab" data-tab="archive" onclick="switchTab('archive', this)">🕓 Архив запросов</button>
        </nav>

        <!-- Вкладка: Новый анализ -->
        <div class="tab-content active" id="tab-analyze">
            <div class="card">
                <label>Поисковый запрос</label>
                <input id="query" type="text" placeholder="например: как похудеть за месяц">
                <label>URL страницы</label>
                <input id="url" type="url" placeholder="https://example.com/your-article">
                <button class="run-btn" id="run-btn" onclick="runAnalysis()">▶ Запустить анализ</button>
            </div>

            <div class="spinner" id="spinner">
                <div class="spin"></div>
                <p>Получаем AI Overview и анализируем страницу…</p>
            </div>

            <div id="results"></div>
        </div>

        <!-- Вкладка: Архив -->
        <div class="tab-content" id="tab-archive">
            <div class="search-wrap">
                <input id="search" type="text" placeholder="🔎 Поиск по запросу или URL…" oninput="filterHistory()">
                <button class="refresh-btn" onclick="loadHistory()">↻ Обновить</button>
            </div>
            <div id="history-list">
                <p class="empty-msg">Загрузка…</p>
            </div>
        </div>

    </div>

    <div id="toast"></div>
    <script src="/static/app.js"></script>
</body>

</html>
