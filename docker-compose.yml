version: "3.9"

services:
  api:
    build: .
    container_name: gap_analysis_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://gapuser:gappassword@db:5432/gapanalysis
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: gap_analysis_db
    environment:
      - POSTGRES_USER=gapuser
      - POSTGRES_PASSWORD=gappassword
      - POSTGRES_DB=gapanalysis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gapuser -d gapanalysis" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
