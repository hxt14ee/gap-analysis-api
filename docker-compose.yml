version: "3.9"

# Переменные читаются из файла .env в директории проекта.
# Скопируйте .env.example → .env и заполните значения перед запуском.

services:
  api:
    build: .
    container_name: gap_analysis_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # DATABASE_URL переопределяем здесь, чтобы хост всегда указывал на сервис db
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - SERPAPI_URL=${SERPAPI_URL:-https://scraperapi.thordata.com/request}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai/gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: gap_analysis_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
