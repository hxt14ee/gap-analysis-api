version: "3.9"

# Все переменные читаются из .env (cp .env.example .env)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gap_analysis_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - SERPAPI_URL=${SERPAPI_URL:-https://scraperapi.thordata.com/request}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai/gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gap_analysis_frontend
    ports:
      - "8501:8501"
    depends_on:
      - api
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: gap_analysis_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
